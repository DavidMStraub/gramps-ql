name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        gramps-version: ["6.0.8"]
        include:
          # oldest supported Gramps version
          - python-version: "3.10"
            gramps-version: "6.0.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm needs the tags to determine the version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Ubuntu dependencies
        # Gramps imports GLib via PyGObject, which PyPI only ships as an sdist
        run: |
          sudo apt-get update
          sudo apt-get -y install pkg-config libcairo2-dev libgirepository-2.0-dev gir1.2-glib-2.0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev
          pip install . "gramps[GUI]==${{ matrix.gramps-version }}"
          pip list
      - name: Test with pytest
        run: pytest

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev
          pip install .
      - name: Lint with ruff
        run: ruff check .
      - name: Check formatting with ruff
        run: ruff format --check .
      - name: Type check with mypy
        run: mypy src
