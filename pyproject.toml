[project]
name = "gramps-ql"
description = "A Python library to filter Gramps objects by a query syntax"
authors = [
  { name = "David M. Straub", email = "straub@protonmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dynamic = ["version"]
keywords = ["Gramps", "genealogy", "query language"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Sociology :: Genealogy",
]
requires-python = ">=3.10"
dependencies = ["pyparsing>=3", "gramps>=6.0.0"]

[project.urls]
homepage = "https://github.com/DavidMStraub/gramps-ql"
repository = "https://github.com/DavidMStraub/gramps-ql"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.15", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=77.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# NOTE: Using a version file avoids some overhead
#
# This file is explicitly ignored by version control.
write_to = "src/gramps_ql/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
exclude = ["_version\\.py$"]

[[tool.mypy.overrides]]
# Gramps ships no type information
module = ["gramps.*", "gramps_ql._version"]
ignore_missing_imports = true

[tool.ruff]
# the formatter would reformat the Python snippets in the README
extend-exclude = ["*.md"]

[tool.ruff.lint]
extend-select = [
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "D",    # pydocstyle
]
ignore = [
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
